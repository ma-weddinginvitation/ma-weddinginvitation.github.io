<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Meeran Mydeen &amp; Amra Banu | Wedding Invitation | 10 January 2027</title>
    <meta
      name="description"
      content="Mr. Syed Ibrahim &amp; Mrs. Najiba Begam cordially invite you and your family to the wedding of Meeran Mydeen with Amra Banu on Sunday, 10 January 2027, 11:00 AM – 12:00 PM, at Drizzle Elite Mahal, Courtallam, Tamil Nadu 627805."
    />
    <meta name="theme-color" content="#2c060c" />
    <meta name="author" content="Mr. Syed Ibrahim &amp; Mrs. Najiba Begam" />

    <!-- WhatsApp, Facebook and other link previews. Set VITE_SITE_URL in .env before
         the final build: WhatsApp only shows the image when its URL is absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Meeran &amp; Amra Wedding Invitation" />
    <meta property="og:title" content="Meeran Mydeen &amp; Amra Banu | Wedding Invitation" />
    <meta
      property="og:description"
      content="Sunday, 10 January 2027 · 11:00 AM – 12:00 PM · Drizzle Elite Mahal, Courtallam. Your presence and blessings will make this celebration truly special."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Royal maroon and gold wedding invitation for Meeran and Amra" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Meeran Mydeen &amp; Amra Banu | Wedding Invitation" />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.jpg" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Paints before the JS bundle arrives, so guests never see a white flash. -->
    <style>
      html, body { margin: 0; background: #2c060c; }
      .boot { position: fixed; inset: 0; display: grid; place-items: center; }
      .boot span {
        font: 400 28px/1 Georgia, 'Times New Roman', serif;
        letter-spacing: 0.3em; margin-right: -0.3em; color: #d9b866;
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      @keyframes boot-pulse { 50% { opacity: 0.35; } }
      @media (prefers-reduced-motion: reduce) { .boot span { animation: none; } }
    </style>
    <!-- If the app cannot start, guests still get the wedding details instead of an endless loader. -->
    <script>
      window.showInvitationFallback = function () {
        document.getElementById('root').innerHTML = document.getElementById('invitation-fallback').innerHTML
      }
      window.addEventListener('error', function (event) {
        if (event.target && event.target.tagName === 'SCRIPT') window.showInvitationFallback()
      }, true)
      // On a very slow connection the app replaces these details as soon as it arrives.
      setTimeout(function () {
        if (document.querySelector('.boot')) window.showInvitationFallback()
      }, 15000)
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading your invitation"><span>M &amp; A</span></div>
    </div>
    <noscript>
      <div style="padding: 32px; color: #f7efdc; font-family: Georgia, serif; text-align: center; line-height: 1.7">
        <h1>Meeran Mydeen with Amra Banu</h1>
        <p>
          mr. Syed Ibrahim &amp; mrs. Najiba Begam cordially invite you and your family to grace the wedding
          celebration of our beloved son.
        </p>
        <p>Sunday, 10 January 2027<br />11:00 AM – 12:00 PM</p>
        <p>Drizzle Elite Mahal<br />Courtallam, Tamil Nadu 627805</p>
      </div>
    </noscript>
    <template id="invitation-fallback">
      <div style="padding: 32px; color: #f7efdc; font-family: Georgia, serif; text-align: center; line-height: 1.7">
        <h1>Meeran Mydeen with Amra Banu</h1>
        <p>
          mr. Syed Ibrahim &amp; mrs. Najiba Begam cordially invite you and your family to grace the wedding
          celebration of our beloved son.
        </p>
        <p>Sunday, 10 January 2027<br />11:00 AM – 12:00 PM</p>
        <p>Drizzle Elite Mahal<br />Courtallam, Tamil Nadu 627805</p>
        <p><a href="" style="color: #d9b866">Tap here to reload the full invitation</a></p>
      </div>
    </template>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
